spring:
  port: 8082
  application:
    name: billing-payment

  config:
    import:
      - "optional:configserver:"
      - "optional:vault://"

  cloud:
    vault:
      uri: http://localhost:8200 # votre URL
      authentication: TOKEN
      token: ${VAULT_TOKEN:root} # Votre valeur de Token
      kv:
        enabled: true
        backend: secret
        default-context: billing-payment
        application-name: billing-payment

  datasource:
    url: ${spring.datasource.url:}
    username: ${spring.datasource.username:}
    password: ${spring.datasource.password:}
    driver-class-name: org.postgresql.Driver
    cache: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas: payment
    default-schema: payment
    baseline-on-migrate: true
    locations: classpath:scripts

  rabbitmq:
    host: 149.56.107.189
    port: 5672
    username: admin
    password: AgQH5EFSTk8QeHNFwG3c
    virtual-host: /


app:
  feign-clients:
    reference-service:
      name: billing-invoice
      url: http://localhost:8080

